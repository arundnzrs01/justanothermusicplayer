name: torrent_music
description: Just Another Music Player (JAMP) — local music player with P2P acquisition.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  dio: ^5.8.0+1
  html: ^0.15.5+1
  file_picker: ^8.3.7
  flex_color_picker: ^3.7.0
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  libtorrent_flutter: ^1.9.1
  receive_sharing_intent: ^1.9.0
  app_links: ^7.2.1
  connectivity_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  macos:
    generate: true
  web:
    generate: true
    background_color: "#1B4332"
    theme_color: "#52B788"
  windows:
    generate: true

flutter:
  uses-material-design: true
